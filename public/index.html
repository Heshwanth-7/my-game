<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Number Quest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main class="card">
    <h1>NUMBER <span>QUEST</span></h1>
    <p class="sub">I'm thinking of a number between 1 and 100</p>

    <div class="stats">
      <div><small>TRIES</small><strong id="tries">0</strong></div>
      <div><small>RANGE</small><strong id="range">1 – 100</strong></div>
    </div>

    <div class="meter"><div id="meterFill"></div></div>

    <div class="row">
      <input id="guess" type="number" inputmode="numeric" placeholder="?" min="1" max="100">
      <button id="btn" class="primary">GUESS</button>
    </div>
    <p id="message" class="message">Make your first guess!</p>

    <div id="saveBox" class="row hidden">
      <input id="name" placeholder="Your name" maxlength="20">
      <button id="saveBtn" class="gold">SAVE</button>
    </div>

    <button id="restart" class="ghost">New game</button>

    <h2>Leaderboard</h2>
    <ol id="scores"></ol>
  </main>

  <script src="script.js"></script>
</body>
</html>
